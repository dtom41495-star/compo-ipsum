<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription — Ipsum Média</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rouge:#E8461E; --encre:#1A1A2E; --gris:#6B7280; --gris-clair:#F5F5F3; --gris-bord:#E5E5E0;
    --vert:#155724; --vert-bg:#D4EDDA;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'DM Sans',sans-serif;background:var(--gris-clair);color:var(--encre);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.2rem;}
  .carte{background:white;border-radius:16px;max-width:480px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.1);overflow:hidden;}
  .bandeau{background:linear-gradient(135deg,var(--rouge) 0%,var(--encre) 130%);padding:1.5rem 1.6rem;color:white;}
  .marque{font-family:'DM Sans',sans-serif;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.1em;color:rgba(255,255,255,0.6);margin-bottom:0.5rem;}
  .titre-ev{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.3rem;line-height:1.3;}
  .corps{padding:1.6rem;}
  .info-ligne{display:flex;align-items:center;gap:0.6rem;font-size:0.88rem;color:var(--encre);margin-bottom:0.6rem;}
  .info-ligne .puce{width:20px;flex-shrink:0;text-align:center;}
  label{display:block;font-size:0.72rem;font-weight:600;color:var(--gris);text-transform:uppercase;letter-spacing:0.04em;margin:0 0 5px;}
  input,textarea{width:100%;padding:0.65rem 0.8rem;border:1.5px solid var(--gris-bord);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.9rem;outline:none;margin-bottom:1rem;transition:border-color .15s;}
  input:focus,textarea:focus{border-color:var(--rouge);}
  textarea{resize:vertical;min-height:70px;}
  button{width:100%;padding:0.8rem;border:none;border-radius:9px;background:var(--rouge);color:white;font-family:'Poppins',sans-serif;font-weight:700;font-size:0.92rem;cursor:pointer;transition:opacity .15s;}
  button:hover{opacity:0.9;}
  button:disabled{opacity:0.6;cursor:default;}
  .site{display:none;}
  .etat{text-align:center;padding:2.5rem 1.6rem;}
  .etat .picto{font-size:2.2rem;margin-bottom:0.8rem;}
  .etat .msg{font-family:'Poppins',sans-serif;font-weight:700;font-size:1.05rem;margin-bottom:0.4rem;}
  .etat .detail{font-size:0.85rem;color:var(--gris);}
  .confirmation{background:var(--vert-bg);color:var(--vert);border-radius:8px;padding:0.6rem 0.9rem;font-size:0.82rem;margin-top:0.8rem;display:none;}
  .erreur{color:#A32D2D;font-size:0.82rem;margin-top:0.6rem;display:none;}
  .pied{text-align:center;font-size:0.66rem;color:var(--gris);padding:1rem 1.6rem 1.4rem;text-transform:uppercase;letter-spacing:0.08em;}
</style>
</head>
<body>
  <div class="carte" id="carte">
    <div class="etat" id="etat-chargement">
      <div class="picto">⏳</div>
      <div class="msg">Chargement…</div>
    </div>
  </div>

<script>
var SB_URL = 'https://ctmekufqaxdelgfyjwly.supabase.co';
var FN_URL = SB_URL + '/functions/v1/agenda-inscription-externe';

var params = new URLSearchParams(window.location.search);
var eventId = params.get('event');
var carte = document.getElementById('carte');

function appeler(action, donnees){
  return fetch(FN_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({action:action}, donnees))
  }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok, statut:r.status, data:d}; }); });
}

function etatErreur(titre, detail){
  carte.innerHTML = '<div class="etat"><div class="picto">🤔</div><div class="msg">'+titre+'</div><div class="detail">'+(detail||'')+'</div></div>';
}

function formatDate(iso){
  var d = new Date(iso);
  var jours = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  var mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  var h = d.getHours(), m = d.getMinutes();
  return jours[d.getDay()]+' '+d.getDate()+' '+mois[d.getMonth()]+' à '+h+'h'+(m<10?'0'+m:m);
}

function afficherFormulaire(ev){
  var html = '<div class="bandeau"><div class="marque">Ipsum Média</div><div class="titre-ev">'+escHtml(ev.titre)+'</div></div>';
  html += '<div class="corps">';
  html += '<div class="info-ligne"><span class="puce">📅</span><span>'+formatDate(ev.date_debut)+'</span></div>';
  if(ev.lieu) html += '<div class="info-ligne"><span class="puce">📍</span><span>'+escHtml(ev.lieu)+'</span></div>';
  if(ev.lien_visio) html += '<div class="info-ligne"><span class="puce">🔗</span><span>Rendez-vous en visio (le lien te sera envoyé par email)</span></div>';

  if(ev.complet){
    html += '<div class="etat" style="padding:1.5rem 0 0.5rem;"><div class="picto">😔</div><div class="msg">Complet</div><div class="detail">Il n\'y a plus de place disponible pour cet événement.</div></div>';
    html += '</div>';
    carte.innerHTML = html;
    return;
  }

  html += '<form id="form-inscription" style="margin-top:1rem;">';
  html += '<label for="nom">Ton nom</label><input id="nom" name="nom" type="text" required maxlength="200" autocomplete="name">';
  html += '<label for="email">Ton email</label><input id="email" name="email" type="email" required autocomplete="email">';
  html += '<label for="message">Un mot sur toi ou ta motivation (facultatif)</label><textarea id="message" name="message" maxlength="1000" placeholder="Pourquoi tu veux nous rejoindre, si tu veux nous en dire plus…"></textarea>';
  // Honeypot — invisible pour un humain, un bot qui remplit tout le formulaire le remplira aussi.
  // display:none (plutôt qu'un positionnement hors écran) : un champ juste déplacé hors du
  // viewport reste "visible" pour beaucoup de gestionnaires de mots de passe/autofill, qui le
  // remplissaient parfois (surtout avec un name="site" qui ressemble à un champ "site web") —
  // ça faisait échouer silencieusement l'inscription de vraies personnes, sans erreur visible.
  html += '<input class="site" type="text" name="site" id="site" tabindex="-1" autocomplete="off" aria-hidden="true">';
  html += '<button type="submit" id="btn-envoyer">Je m\'inscris</button>';
  html += '<div class="confirmation" id="confirmation">C\'est noté ! Regarde ta boîte mail pour la confirmation.</div>';
  html += '<div class="erreur" id="erreur"></div>';
  html += '</form>';
  html += '</div>';
  html += '<div class="pied">Ipsum Média · Rédaction associative</div>';
  carte.innerHTML = html;

  document.getElementById('form-inscription').addEventListener('submit', function(e){
    e.preventDefault();
    var btn = document.getElementById('btn-envoyer');
    var erreurEl = document.getElementById('erreur');
    erreurEl.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Envoi…';
    appeler('inscrire', {
      evenementId: eventId,
      nom: document.getElementById('nom').value.trim(),
      email: document.getElementById('email').value.trim(),
      message: document.getElementById('message').value.trim(),
      site: document.getElementById('site').value
    }).then(function(res){
      if(res.ok && res.data.ok){
        document.getElementById('form-inscription').style.display = 'none';
        document.getElementById('confirmation').style.display = 'block';
        return;
      }
      btn.disabled = false; btn.textContent = 'Je m\'inscris';
      var messages = {
        email_invalide: 'Cette adresse email ne semble pas valide.',
        nom_invalide: 'Indique ton nom.',
        complet: 'Il n\'y a plus de place — désolé !',
        introuvable: 'Cet événement n\'est plus disponible.'
      };
      erreurEl.textContent = messages[res.data && res.data.error] || 'Un souci est survenu, réessaie dans un instant.';
      erreurEl.style.display = 'block';
    }).catch(function(){
      btn.disabled = false; btn.textContent = 'Je m\'inscris';
      erreurEl.textContent = 'Erreur réseau — réessaie dans un instant.';
      erreurEl.style.display = 'block';
    });
  });
}

function escHtml(s){
  var d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

if(!eventId){
  etatErreur('Lien incomplet', 'Il manque une information dans ce lien — demande-le à nouveau à la personne qui te l\'a envoyé.');
} else {
  appeler('lire', {evenementId: eventId}).then(function(res){
    if(res.ok && res.data.ok){
      afficherFormulaire(res.data.evenement);
    } else {
      etatErreur('Introuvable', 'Cet événement n\'existe plus ou n\'est pas ouvert aux inscriptions externes.');
    }
  }).catch(function(){
    etatErreur('Erreur de connexion', 'Réessaie dans un instant.');
  });
}
</script>
</body>
</html>
